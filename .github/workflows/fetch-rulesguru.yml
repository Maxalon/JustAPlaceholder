name: Fetch RulesGuru evaluation corpus

# Manual only. Downloads the public RulesGuru question pool through its documented API
# (https://rulesguru.org/api/documentation/) and stores it on the `eval-corpus` branch,
# for scoring the deterministic rules engine.
#
# RulesGuru's license (https://github.com/KingSupernova31/RulesGuru/blob/main/LICENSE.md)
# forbids using it for building, improving or validating machine-learning models, and any
# commercial use. This corpus is therefore for measuring the rules engine only. It must not
# be used to train or evaluate the natural-language parser model, and must not ship in an app.

on:
  workflow_dispatch:
    inputs:
      max_questions:
        description: "Upper bound on questions to request (the API refuses counts above what is available; the job steps down until it succeeds)"
        default: "1600"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download questions
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          UA="mtg-judge-eval/0.1 (+https://github.com/${GITHUB_REPOSITORY})"
          count=${{ inputs.max_questions }}
          ok=0
          while [ "$count" -ge 100 ]; do
            settings=$(jq -cn --argjson c "$count" '{count:$c, level:["0","1","2","3","Corner Case"], complexity:["Simple","Intermediate","Complicated"], legality:"all", tags:["Unsupported answers"], tagsConjunc:"NOT"}')
            url="https://rulesguru.org/api/questions?json=$(jq -rn --arg s "$settings" '$s|@uri')"
            code=$(curl -sS -m 300 -A "$UA" -o "$OUT/rulesguru-questions.json" -w "%{http_code}" "$url" || echo 000)
            echo "count=$count -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            count=$((count - 100))
            sleep 3   # the API asks for at most one request every 2 seconds
          done
          [ "$ok" = 1 ] || { echo "::error::Could not fetch questions"; cat "$OUT/rulesguru-questions.json" || true; exit 1; }
          n=$(jq 'length' "$OUT/rulesguru-questions.json")
          echo "fetched $n questions"
          jq -c '.[0] | del(.includedCards)' "$OUT/rulesguru-questions.json" | head -c 1500; echo
          jq -n --arg fetched_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson n "$n" \
            '{fetched_at:$fetched_at, questions:$n, source:"https://rulesguru.org/api/questions", license:"https://github.com/KingSupernova31/RulesGuru/blob/main/LICENSE.md", use:"measurement of the deterministic rules engine only; not for training or validating machine-learning models; not for commercial use"}' > "$OUT/manifest.json"
          cat > "$OUT/README.md" <<'MD'
          # RulesGuru evaluation corpus

          Public rules questions fetched from https://rulesguru.org/ through its API, used only to
          measure how many questions the deterministic rules engine answers correctly, refuses, or gets wrong.

          RulesGuru is source-available software © Isaac King; see its license:
          https://github.com/KingSupernova31/RulesGuru/blob/main/LICENSE.md
          It prohibits AI/machine-learning use (including validation), commercial use, and competing use.
          Do not use this corpus to train or evaluate a model, and do not ship it in a product.
          MD

      - name: Publish to the eval-corpus branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          git init -q -b eval-corpus
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "RulesGuru evaluation corpus $(date -u +%Y-%m-%d)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" eval-corpus
